<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>서명하기</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h2>{{ name }}님, 서명해주세요</h2>
        <p class="desc">네모 박스 안에 정자체로 서명해 주세요.</p>
        
        <div class="canvas-container">
            <canvas id="signature-pad" width="400" height="200"></canvas>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="clearPad()">다시 쓰기</button>
                <button type="button" onclick="submitSignature()">제출하기</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
