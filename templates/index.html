<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ site.academic_year }}년 {{ site.semester }} {{ site.organization_name }} - {{ site.main_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <img src="{{ url_for('static', filename=site.logo) }}"
             alt="{{ site.organization_name }} 로고"
             class="logo">

        <h2>
            {{ site.academic_year }}년 {{ site.semester }} '{{ site.organization_name }}'<br>
            {{ site.main_title }}
        </h2>

        <form action="/verify" method="POST">
            {% if error %}
            <p class="error-msg">{{ error }}</p>
            {% endif %}

            <div class="input-group">
                <input type="text" name="name" placeholder="이름을 입력하세요" required>
            </div>

            <div class="input-group">
                <input type="tel" name="phone_last4"
                       placeholder="전화번호 뒷자리 4자리"
                       maxlength="4"
                       inputmode="numeric"
                       required>
            </div>

            <button type="submit">본인 인증하기</button>
        </form>

        <p class="help-msg">
            <strong>{{ site.help_title }}</strong>
            {{ site.help_message }}
        </p>
    </div>

    <footer>
        <div class="copyright">
            © {{ site.academic_year }} NEWMAN. All rights reserved.
        </div>
        <div class="developer">Developed by Stephen Kim</div>    
    </footer>

</body>
</html>
