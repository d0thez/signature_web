<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>서명 완료 - 감사합니다!</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .success-icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: inline-block;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .thank-you-container {
            text-align: center;
        }

        .thank-you-container h2 {
            margin-bottom: 16px;
        }

        .slogan {
            font-weight: 600;
            color: var(--primary);
            margin-top: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container thank-you-container">
        <div class="success-icon">🎉</div>

        <h2>
            {{ site.academic_year }}학년도 {{ site.semester }}<br>
            {{ site.organization_name }} {{ site.completion_title }}
        </h2>

        <p class="desc">
            {{ site.completion_message }}
        </p>

        <div class="slogan">{{ site.slogan }}</div>

        <a href="/" style="margin-top: 24px;">
            <button type="button">메인 화면으로 돌아가기</button>
        </a>
    </div>

</body>
</html>
